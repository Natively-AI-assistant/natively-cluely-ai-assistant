
[package]
name = "natively-audio"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8.3", features = ["napi4"] }
napi-derive = "3.5.2"
cpal = "0.15.2"
ringbuf = "0.4"
anyhow = "1.0"
once_cell = "1.18.0"
rubato = "0.16"
rand = "0.8"
sha2 = "0.10"
machine-uid = "0.5"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1.0"
webrtc-vad = "0.4"
# Zero-copy reinterpret of &[i16] as &[u8] for napi Buffer hand-off.
# Replaces a per-chunk per-sample to_le_bytes loop in the DSP hot path.
bytemuck = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# classic-objc-retain-release: on arm64 cidre otherwise retains and releases
# through objc_retain_x<N> / objc_release_x<N>, register variants libobjc gained
# in macOS 13. They are strong imports, so on an Apple Silicon Mac running
# macOS 12 dyld refused the whole module (mic, system audio and every other
# native export). The classic objc_retain / objc_release exist on every macOS.
# scripts/lib/native-link-checks.cjs fails the build if the variants come back.
cidre = { version = "0.11.10", default-features = false, features = ["ca", "cm", "av", "cat", "dispatch", "ns", "sc", "cf", "blocks", "async", "objc", "core_audio", "macos_15_0", "classic-objc-retain-release"] }
# Used by stealth_window to access NSWindow APIs Electron doesn't expose
# (becomesKeyOnlyIfNeeded, hidesOnDeactivate, collectionBehavior). objc2 is
# the actively-maintained Rust↔Objective-C bridge; objc2-app-kit gives strongly
# typed AppKit bindings so we can avoid raw msg_send! ergonomics.
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSResponder"] }
objc2-foundation = "0.2"
# Blocks for EventKit's permission completion handler (calendar_events.rs).
# Already in the lock as objc2's own dependency; same version.
block2 = "0.5"
# CGEventTap: session-wide keyboard interception for true Cluely-grade
# stealth input. The tap captures keystrokes BEFORE they reach the
# foreground app, so the user can type into Natively while Zoom/browser
# stays as the OS-level frontmost+key application throughout. core-graphics
# wraps CGEventTapCreate/CGEventGetFlags/CGEventKeyboardGetUnicodeString;
# core-foundation gives us the CFRunLoop the tap must attach to.
core-graphics = "0.24"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# System audio: PulseAudio/PipeWire monitor source (src/speaker/linux.rs).
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.13.0"
# Win32 features:
#   Win32_Media_Audio / Win32_System_Com  — WASAPI system-audio capture (existing).
#   Win32_System_Threading                — GetCurrentThreadId (existing) + PostThreadMessageW.
#   Win32_UI_WindowsAndMessaging          — SetWindowsHookExW / CallNextHookEx /
#                                           UnhookWindowsHookEx / GetMessageW / the WH_*
#                                           + WM_* constants + KBDLLHOOKSTRUCT. This is the
#                                           Windows analogue of the macOS CGEventTap used by
#                                           keyboard_tap.rs for stealth typing (type into the
#                                           overlay without the window taking OS focus).
#   Win32_UI_Input_KeyboardAndMouse       — ToUnicodeEx / GetKeyState (VK→char translation).
#   Win32_System_LibraryLoader            — GetModuleHandleW (hmod for the LL hook).
windows = { version = "0.52.0", features = [
    "Win32_Media_Audio",
    #   Win32_Media_Audio_Endpoints       — IAudioMeterInformation: per-endpoint output
    #                                       peak, to see which device the meeting plays on.
    "Win32_Media_Audio_Endpoints",
    #   Win32_System_Com_StructuredStorage + Win32_System_Variant — required by the
    #                                       binding's gate on IMMDevice::Activate.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    #   Win32_UI_Accessibility            — SetWinEventHook/UnhookWinEvent, used to notice
    #                                       the foreground app changing (Alt+Tab) so stealth
    #                                       typing stops, matching macOS panel key-resign.
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    #   Win32_System_Registry             — the microphone consent store (meeting_signals.rs):
    #                                       which apps are using the microphone right now.
    "Win32_System_Registry",
    #   Win32_System_Variant / Win32_System_Ole — a cached UI Automation property as a
    #                                       VARIANT (call_tree.rs: a meeting link's address).
    "Win32_System_Variant",
    "Win32_System_Ole",
] }
tracing = "0.1.44"

# Release strip, set per crate. Cargo's default (strip "debuginfo" whenever
# debug info is off) also applies to the proc macros and build scripts Cargo
# builds for the host, and rustc strips on macOS with rust-objcopy. With
# Xcode 27, 7 of the 10 proc-macro dylibs came out of that strip with
# their string table off an 8-byte boundary. macOS 27's dyld refuses those, so
# rustc could not load them and stopped with "error[E0463]: can't find crate
# for `zerofrom_derive`" (seen 2026-11-01 on a clean target/). Those host tools
# are never shipped, so they are left unstripped. The module we ship keeps the
# same strip as before on every platform, and build-native.js still pads its
# string table on macOS (scripts/lib/macho-align-strtab.cjs).
[profile.release]
strip = false

[profile.release.package.natively-audio]
strip = "debuginfo"

[features]
# Dev-only: see src/fault_injection.rs. Never enabled for shipped builds.
fault-injection = []
