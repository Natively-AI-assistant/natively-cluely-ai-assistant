<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decider Adjudication</title>
<!--
  Offline adjudication for Auto Answer decider records the teacher could not settle
  (campaign Phase 1, step 6). Open this file in a browser, choose data/work/dataset/adjudicate.jsonl,
  press a / s / w per record (answer / silent / wait), x to skip, ← → to move.
  "Export" downloads adjudicated.jsonl: {"id","label","adjudicator":"human"}.
  build_dataset.py --adjudicated <file> merges it back with a one-hot soft label.
  Nothing leaves the machine: no network, no storage beyond this tab's localStorage draft.
-->
<style>
  :root { --bg:#fbfbfd; --fg:#1d1d1f; --muted:#6e6e73; --card:#fff; --line:#e5e5ea; --accent:#6F7CF0; --ans:#1f9d55; --sil:#8e8e93; --wait:#c77700; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111113; --fg:#f2f2f7; --muted:#98989f; --card:#1c1c1f; --line:#2c2c30; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:18px; font-weight:600; margin:0 auto 0 0; }
  button, label.btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .meta { color:var(--muted); font-size:13px; }
  .turn { padding:4px 0; border-bottom:1px dashed var(--line); white-space:pre-wrap; overflow-wrap:anywhere; }
  .turn b { font-weight:600; }
  .cand { font-size:17px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .votes span { display:inline-block; margin:2px 6px 2px 0; padding:2px 8px; border-radius:999px; border:1px solid var(--line); font-size:13px; }
  .keys { display:flex; gap:8px; flex-wrap:wrap; }
  .keys button { flex:1; min-width:120px; padding:12px; font-weight:600; }
  .keys .a { border-color:var(--ans); color:var(--ans); } .keys .s { border-color:var(--sil); color:var(--sil); } .keys .w { border-color:var(--wait); color:var(--wait); }
  .chosen { outline:3px solid var(--accent); }
  .def { color:var(--muted); font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Decider adjudication</h1>
    <label class="btn">Open JSONL <input id="file" type="file" accept=".jsonl,.json" hidden></label>
    <button id="export">Export</button>
    <span id="progress" class="meta"></span>
  </header>
  <div id="view" class="meta">Open data/work/dataset/adjudicate.jsonl to start.</div>
</main>
<script>
const LABELS = { a: 'answer', s: 'silent', w: 'wait' };
let rows = [], i = 0, decisions = {};
const esc = (t) => String(t ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function load() { try { decisions = JSON.parse(localStorage.getItem('decider-adjudication') || '{}'); } catch { decisions = {}; } }
function save() { try { localStorage.setItem('decider-adjudication', JSON.stringify(decisions)); } catch {} }
function render() {
  const v = document.getElementById('view');
  const done = rows.filter((r) => decisions[r.id]).length;
  document.getElementById('progress').textContent = rows.length ? `${i + 1} / ${rows.length} · ${done} decided` : '';
  if (!rows.length) return;
  const r = rows[i];
  const votes = (r.votes ?? []).map((x) => `<span>${esc(x.view)} ${esc(x.effort)}: <b>${esc(x.label ?? '—')}</b>${x.reason ? ' · ' + esc(x.reason) : ''}</span>`).join('');
  const ctx = (r.context ?? []).map((t) => `<div class="turn"><b>${esc(t.speaker)}:</b> ${esc(t.text)}</div>`).join('');
  const d = decisions[r.id];
  v.className = '';
  v.innerHTML = `
    <div class="card meta">${esc(r.id)} · mode ${esc(r.mode)} · user ${esc(r.user_name ?? '(unnamed)')}${r.transcript_lagging ? ' · <b>transcript lagging</b>' : ''}</div>
    <div class="card"><div class="meta">Context (oldest first)</div>${ctx || '<div class="meta">none</div>'}</div>
    ${r.last_answered ? `<div class="card"><div class="meta">Already answered</div>${esc(r.last_answered)}</div>` : ''}
    <div class="card"><div class="meta">Candidate (judge this)</div><div class="cand">${esc(r.candidate)}</div></div>
    <div class="card votes"><div class="meta">Teacher votes</div>${votes}</div>
    <div class="keys">
      <button class="a ${d === 'answer' ? 'chosen' : ''}" data-k="a">a · answer</button>
      <button class="s ${d === 'silent' ? 'chosen' : ''}" data-k="s">s · silent</button>
      <button class="w ${d === 'wait' ? 'chosen' : ''}" data-k="w">w · wait</button>
    </div>
    <div class="def">answer: a finished question or task for the USER, incl. short/yes-no and declarative tasks.
      silent: not an ask, aimed at someone else, rhetorical or self-answered, logistics, permission, deferral, or already answered.
      wait: an unfinished fragment, or a structure announced but not yet delivered.</div>`;
  v.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => key(b.dataset.k));
}
function key(k) {
  if (!rows.length) return;
  if (LABELS[k]) { decisions[rows[i].id] = LABELS[k]; save(); if (i < rows.length - 1) i++; }
  else if (k === 'x' || k === 'ArrowRight') { if (i < rows.length - 1) i++; }
  else if (k === 'ArrowLeft') { if (i > 0) i--; }
  else return;
  render();
}
document.addEventListener('keydown', (e) => { if (!e.metaKey && !e.ctrlKey) key(e.key); });
document.getElementById('file').onchange = async (e) => {
  const text = await e.target.files[0].text();
  rows = text.split('\n').filter((l) => l.trim()).map((l) => JSON.parse(l));
  i = Math.max(0, rows.findIndex((r) => !decisions[r.id]));
  render();
};
document.getElementById('export').onclick = () => {
  const out = rows.filter((r) => decisions[r.id]).map((r) => JSON.stringify({ id: r.id, label: decisions[r.id], adjudicator: 'human' })).join('\n') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'application/jsonl' }));
  a.download = 'adjudicated.jsonl';
  a.click();
};
load();
</script>
</body>
</html>
