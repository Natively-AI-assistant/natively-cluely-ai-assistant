name: Build Smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC: api-smoke + sd-quality + sd-requirements-gate-* + sd-interview-sim-e2e + sd-interview-sim-t2 + sd-overlay-interview-e2e

jobs:
  electron-entry-smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Belt-and-suspenders: confirm postinstall produced correct-arch
      # binaries. CI runners are macos-latest (arm64), so x86_64 here
      # means the install itself was poisoned. Mirrors the developer-side
      # pre-commit + boot-time gates in main.ts.
      - name: Verify native module architecture
        run: node scripts/verify-native-arch.js

      - name: Typecheck Electron main process
        run: npm run typecheck:electron

      - name: Build renderer
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Verify packaged entrypoint exists
        run: test -f dist-electron/electron/main.js

      # Required packaged local-fallback assets (ONNX/Transformers deps +
      # bundled MiniLM/MobileBERT models + local ONNX worker scripts). Fail the
      # build here if any required core-fallback asset is missing — the app must
      # work on a clean machine with no Ollama and no API keys.
      - name: Verify required local models present
        run: node scripts/download-models.js --verify

      - name: Verify packaged local fallback assets (source mode)
        run: npm run verify:packaged-local-assets

      - name: Run Electron unit tests
        run: npm test

      - name: Run intelligence unit tests
        run: npm run test:intelligence

  api-smoke:
    # Runs weekly (Monday 09:00 UTC) and on demand via workflow_dispatch.
    # Requires secrets: NATIVELY_API_KEY (or NATIVELY_TRIAL_TOKEN) set in repo.
    # Without credentials the suite is skipped cleanly via the env gate.
    name: API Smoke (weekly)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron (test prerequisite)
        run: npm run build:electron

      - name: Run API smoke tests
        run: npm test -- --test-name-pattern 'Natively API'
        env:
          RUN_NATIVELY_API_E2E: ${{ secrets.RUN_NATIVELY_API_E2E }}
          NATIVELY_API_KEY: ${{ secrets.NATIVELY_API_KEY }}
          NATIVELY_TRIAL_TOKEN: ${{ secrets.NATIVELY_TRIAL_TOKEN }}
          NATIVELY_API_BASE: ${{ secrets.NATIVELY_API_BASE }}

  sd-quality:
    # Runs weekly (Monday 09:00 UTC) and on demand via workflow_dispatch.
    # Prefers GEMINI_API_KEY (direct chat + embeddings); NATIVELY_API_KEY is
    # a fallback. Without credentials the harness skips cleanly (exit 0).
    # NEVER runs on pull_request — guarded by the job-level `if` below.
    name: SD Quality (weekly)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron (test prerequisite)
        run: npm run build:electron

      - name: Run SD grounding quality harness (development split)
        run: ./node_modules/.bin/electron scripts/benchmark-sd-grounding.js
        env:
          # Opt-in: set either secret to "1". Harness prefers GEMINI_API_KEY.
          RUN_SD_GROUNDING_E2E: ${{ secrets.RUN_SD_GROUNDING_E2E }}
          RUN_NATIVELY_API_E2E: ${{ secrets.RUN_NATIVELY_API_E2E }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NATIVELY_API_KEY: ${{ secrets.NATIVELY_API_KEY }}
          NATIVELY_TRIAL_TOKEN: ${{ secrets.NATIVELY_TRIAL_TOKEN }}
          NATIVELY_API_BASE: ${{ secrets.NATIVELY_API_BASE }}
          BENCHMARK_MODEL: gemini-3.1-flash-lite
          SD_BENCHMARK_SPLIT: development

  sd-requirements-gate-e2e:
    # Runs weekly (Monday 09:00 UTC) and on demand via workflow_dispatch.
    # Stub LLM core matrix (ticket 13) — no API secrets required.
    # Env: NATIVELY_E2E=1 (set by npm script). Exit 0 skip if gate/SessionTracker
    # dist artifacts are missing. NEVER runs on pull_request — job-level `if` below.
    # Tier 0 Requirements-gate suite is already on PRs via electron-entry-smoke
    # `npm test` (SdRequirementsGateTier0.test.mjs under electron/llm/__tests__/).
    name: SD Requirements Gate E2E (weekly)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron (test prerequisite)
        run: npm run build:electron

      - name: Run SD Requirements-gate Electron e2e (core matrix)
        run: npm run e2e:sd-requirements-gate

  # T1 SD interview-sim Electron fixture matrix (ticket 04). Sibling of
  # sd-requirements-gate-e2e — additive; does NOT replace gate e2e ownership.
  # Stub SUT ($0 live API). schedule / workflow_dispatch only — NEVER pull_request.
  sd-interview-sim-e2e:
    name: SD Interview Sim E2E (weekly)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron (test prerequisite)
        run: npm run build:electron

      - name: Run SD interview-sim Electron fixture matrix (T1)
        run: npm run e2e:sd-interview-sim

  # SD Overlay Interview UI e2e (additive Playwright `_electron` core matrix).
  # schedule / workflow_dispatch only — NEVER pull_request.
  # Live product LLM (GEMINI_API_KEY); exit 0 skip when key missing.
  # NOT a T2/dual-agent CI oracle — asserts overlay chrome (strip / soft-refuse /
  # Advance hide / post-gate answer), not dual-agent free-form corpus quality.
  # Does not replace gate e2e, sim T1, Profile interview-simulator, or T2.
  sd-overlay-interview-e2e:
    name: SD Overlay Interview UI E2E (weekly)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Renderer build required so `data-testid` hooks ship in dist/ for Playwright.
      - name: Build renderer
        run: npm run build

      - name: Build Electron (test prerequisite)
        run: npm run build:electron

      - name: Run SD overlay interview UI e2e (live LLM; skip without key)
        run: npm run e2e:sd-overlay-interview
        env:
          RUN_SD_OVERLAY_INTERVIEW: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NATIVELY_API_KEY: ${{ secrets.NATIVELY_API_KEY }}
          SD_OVERLAY_INTERVIEW_MAX_TURNS: '12'
          SD_OVERLAY_INTERVIEW_MAX_MS: '180000'
          # Optional: set SD_OVERLAY_INTERVIEW_MAX_USD in the job env to cap spend.

      - name: Upload overlay interview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sd-overlay-interview-artifacts
          path: debug-artifacts/sd-overlay-interview/
          if-no-files-found: ignore

  # T2 dual-agent overnight corpus (ticket 05). Headless; opt-in spend caps.
  # workflow_dispatch / schedule only — NEVER pull_request. Exit 0 skip without
  # RUN_SD_INTERVIEW_SIM_T2 + GEMINI_API_KEY. Dual-agent free-form is NOT a
  # pass/fail oracle — job succeeds when the runner exits cleanly (incl. skip).
  sd-interview-sim-t2:
    name: SD Interview Sim T2 (overnight)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SD interview-sim T2 dual-agent (opt-in; skip without keys)
        run: npm run sd-interview-sim:t2
        env:
          RUN_SD_INTERVIEW_SIM_T2: ${{ secrets.RUN_SD_INTERVIEW_SIM_T2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SD_INTERVIEW_SIM_T2_MAX_TURNS: '20'
          SD_INTERVIEW_SIM_T2_MAX_INTERVIEWS: '5'
          SD_INTERVIEW_SIM_T2_MAX_USD: '1.5'

  # Optional Requirements-gate real-API smoke (ticket 15). Sibling of sd-quality:
  # schedule / workflow_dispatch only — NEVER pull_request. Exit 0 skip without keys.
  sd-requirements-gate-smoke:
    name: SD Requirements-gate smoke (weekly)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron (test prerequisite)
        run: npm run build:electron

      - name: Run Requirements-gate real-API smoke (URL shortener gated→advance)
        run: ./node_modules/.bin/electron scripts/benchmark-sd-requirements-gate.js
        env:
          RUN_SD_REQUIREMENTS_GATE_E2E: ${{ secrets.RUN_SD_REQUIREMENTS_GATE_E2E }}
          RUN_SD_GROUNDING_E2E: ${{ secrets.RUN_SD_GROUNDING_E2E }}
          RUN_NATIVELY_API_E2E: ${{ secrets.RUN_NATIVELY_API_E2E }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NATIVELY_API_KEY: ${{ secrets.NATIVELY_API_KEY }}
          NATIVELY_TRIAL_TOKEN: ${{ secrets.NATIVELY_TRIAL_TOKEN }}
          NATIVELY_API_BASE: ${{ secrets.NATIVELY_API_BASE }}
          BENCHMARK_MODEL: gemini-3.1-flash-lite
