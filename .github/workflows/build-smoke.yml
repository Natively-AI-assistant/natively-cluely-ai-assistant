name: Build Smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC (api-smoke + sd-quality)

jobs:
  electron-entry-smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Belt-and-suspenders: confirm postinstall produced correct-arch
      # binaries. CI runners are macos-latest (arm64), so x86_64 here
      # means the install itself was poisoned. Mirrors the developer-side
      # pre-commit + boot-time gates in main.ts.
      - name: Verify native module architecture
        run: node scripts/verify-native-arch.js

      - name: Typecheck Electron main process
        run: npm run typecheck:electron

      - name: Build renderer
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Verify packaged entrypoint exists
        run: test -f dist-electron/electron/main.js

      # Required packaged local-fallback assets (ONNX/Transformers deps +
      # bundled MiniLM/MobileBERT models + local ONNX worker scripts). Fail the
      # build here if any required core-fallback asset is missing — the app must
      # work on a clean machine with no Ollama and no API keys.
      - name: Verify required local models present
        run: node scripts/download-models.js --verify

      - name: Verify packaged local fallback assets (source mode)
        run: npm run verify:packaged-local-assets

      - name: Run Electron unit tests
        run: npm test

      - name: Run intelligence unit tests
        run: npm run test:intelligence

  api-smoke:
    # Runs weekly (Monday 09:00 UTC) and on demand via workflow_dispatch.
    # Requires secrets: NATIVELY_API_KEY (or NATIVELY_TRIAL_TOKEN) set in repo.
    # Without credentials the suite is skipped cleanly via the env gate.
    name: API Smoke (weekly)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron (test prerequisite)
        run: npm run build:electron

      - name: Run API smoke tests
        run: npm test -- --test-name-pattern 'Natively API'
        env:
          RUN_NATIVELY_API_E2E: ${{ secrets.RUN_NATIVELY_API_E2E }}
          NATIVELY_API_KEY: ${{ secrets.NATIVELY_API_KEY }}
          NATIVELY_TRIAL_TOKEN: ${{ secrets.NATIVELY_TRIAL_TOKEN }}
          NATIVELY_API_BASE: ${{ secrets.NATIVELY_API_BASE }}

  sd-quality:
    # Runs weekly (Monday 09:00 UTC) and on demand via workflow_dispatch.
    # Requires secrets: NATIVELY_API_KEY (and optionally RUN_NATIVELY_API_E2E).
    # Without credentials the harness skips cleanly via the env gate (exit 0).
    # NEVER runs on pull_request — guarded by the job-level `if` below.
    name: SD Quality (weekly)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron (test prerequisite)
        run: npm run build:electron

      - name: Run SD grounding quality harness (development split)
        run: ./node_modules/.bin/electron scripts/benchmark-sd-grounding.js
        env:
          RUN_NATIVELY_API_E2E: ${{ secrets.RUN_NATIVELY_API_E2E }}
          NATIVELY_API_KEY: ${{ secrets.NATIVELY_API_KEY }}
          NATIVELY_TRIAL_TOKEN: ${{ secrets.NATIVELY_TRIAL_TOKEN }}
          NATIVELY_API_BASE: ${{ secrets.NATIVELY_API_BASE }}
          BENCHMARK_MODEL: gemini-3.1-flash-lite
          SD_BENCHMARK_SPLIT: development
