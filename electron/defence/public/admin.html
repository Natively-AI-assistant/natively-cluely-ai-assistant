<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Defence Copilot Setup</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell">
<header><div class="brand">Defence Copilot · 电脑端</div><div class="status"><span class="dot on"></span>本地管理</div></header>
<section class="card"><h1>项目知识库</h1><p class="muted">路径只在电脑端提交；iPhone 不会收到项目根路径或完整文件。</p><div class="field"><label>本地项目目录</label><input id="projectPath" placeholder="E:\code\your-project"></div><div class="actions" style="margin-top:12px"><button id="index" class="primary">增量索引</button><button id="rebuild">完全重建</button></div><pre id="indexStatus" class="muted">尚未索引</pre></section>
<section class="card"><h1>连接 iPhone</h1><p>优先扫描高熵一次性二维码。六位码仅作为局域网受限备用入口。</p><div id="urls" class="path"></div><button id="pair" class="primary" style="margin-top:12px">生成一次性配对码</button><div id="pairResult" class="hidden"><img id="pairQr" alt="高熵一次性配对二维码" style="width:min(280px,100%);border-radius:12px;margin-top:12px"><p class="pair-code" id="code"></p><p class="muted">配对 ID：<span id="pairId"></span></p></div></section>
<section class="card banner"><b>隐私默认值</b><p>原始音频不保存；密钥仅从后端环境变量读取；管理端默认只允许本机访问。</p></section></main>
<script>const $=id=>document.getElementById(id);async function index(fullRebuild){$('indexStatus').textContent='索引中…';const r=await fetch('/api/project/index',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:$('projectPath').value||undefined,fullRebuild})});$('indexStatus').textContent=JSON.stringify(await r.json(),null,2)}$('index').onclick=()=>index(false);$('rebuild').onclick=()=>index(true);$('pair').onclick=async()=>{const r=await fetch('/api/pairing/create',{method:'POST'}),d=await r.json();$('pairResult').classList.remove('hidden');$('code').textContent=d.code;$('pairId').textContent=d.id;$('pairQr').src=d.qrDataUrl||'';$('urls').innerHTML=(d.urls||[]).map(url=>`<div><a href="${url}" style="color:#7fc6ff">${url}</a></div>`).join('')};fetch('/api/project/sources').then(r=>r.json()).then(d=>{$('projectPath').value=d.projectRoot||'';$('indexStatus').textContent=JSON.stringify(d,null,2)}).catch(()=>{});</script></body></html>
