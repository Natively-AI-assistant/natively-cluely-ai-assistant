<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6bcb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Project Defence Copilot</title><link rel="manifest" href="/manifest.webmanifest?v=3"><link rel="stylesheet" href="/styles.css?v=3"></head><body><main class="shell"><header><div class="brand">Defence Copilot</div><div class="status"><span id="connectionDot" class="dot"></span><span id="connectionText">未连接</span></div></header>
<section id="pairPanel" class="card"><h1>连接电脑</h1><p class="muted">在电脑端打开 <b>/admin</b> 生成一次性配对码。配对 token 仅保存在本机浏览器。</p><div class="grid"><div class="field"><label>配对 ID</label><input id="pairId" autocomplete="off"></div><div class="field"><label>六位配对码</label><input id="pairCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div></div><div class="actions" style="margin-top:12px"><button id="pairButton" class="primary">安全配对</button></div><p id="pairError" class="muted"></p></section>
<div id="app" class="hidden"><section class="card"><div class="grid"><div class="field"><label>输入语言</label><select id="inputLanguage"><option value="auto">自动 / 中英混合</option><option value="zh">中文</option><option value="en">English</option></select></div><div class="field"><label>输出语言</label><select id="outputLanguage"><option value="follow">跟随问题</option><option value="zh">中文</option><option value="en">English</option><option value="bilingual">中英双语</option></select></div><div class="field"><label>回答模式</label><select id="answerDepth"><option value="brief">极简</option><option value="standard">标准</option><option value="deep">深入</option></select></div><div class="field"><label>联网搜索</label><select id="searchMode"><option value="off">关闭</option><option value="auto">自动</option><option value="on">开启</option></select></div></div></section>
<section id="secureBanner" class="card banner hidden">iPhone Safari 只允许 HTTPS 页面使用麦克风。请按 README 配置可信 HTTPS/WSS；电脑本机的 localhost 例外。</section>
<section class="card"><div class="mic"><div id="micBadge" class="mic-badge">🎙</div><div><h2 id="micTitle">麦克风未启用</h2><div id="detectorState" class="muted">点击开始后会明确请求系统权限</div></div></div><div class="actions" style="margin-top:14px"><button id="startButton" class="primary">开始监听</button><button id="stopButton" disabled>停止监听</button><button id="generateButton">立即生成</button><button id="cancelButton">取消</button></div></section>
<section class="card"><h2>当前转写</h2><div id="transcript" class="muted">等待语音…</div><div class="field" style="margin-top:12px"><label for="manualQuestion">手动问题（可选）</label><textarea id="manualQuestion" rows="3" placeholder="没有麦克风时，可在这里输入中英文问题"></textarea></div></section>
<section id="answerPanel" class="card hidden"><h2>建议口语回答</h2><div id="keywords" class="chips"></div><p id="answer" class="answer"></p><details id="alternateWrap" class="hidden"><summary>另一语言版本</summary><p id="alternate"></p></details><details><summary>可能追问</summary><ul id="followUps"></ul></details><details><summary>项目证据</summary><div id="evidence"></div></details><details id="externalWrap" class="hidden"><summary>外部资料（不代表项目已实现）</summary><div id="external"></div></details></section>
<section class="actions"><button id="retryButton">重新回答</button><button id="clearButton" class="danger">删除本次记录</button><button id="unpairButton">重新配对</button></section></div></main><script src="/app.js?v=3" defer></script></body></html>
