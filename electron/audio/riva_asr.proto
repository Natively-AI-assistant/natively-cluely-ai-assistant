syntax = "proto3";

package nvidia.riva.asr;

service RivaSpeechRecognition {
  rpc StreamingRecognize(stream StreamingRecognizeRequest) returns (stream StreamingRecognizeResponse);
}

message RecognitionConfig {
  enum AudioEncoding { ENCODING_UNSPECIFIED = 0; LINEAR_PCM = 1; FLAC = 2; MULAW = 3; ALAW = 4; OGGOPUS = 5; }
  AudioEncoding encoding = 1;
  int32 sample_rate_hertz = 2;
  string language_code = 3;
  int32 max_alternatives = 4;
  bool enable_automatic_punctuation = 5;
  string model = 6;
  bool verbatim_transcripts = 7;
}

message StreamingRecognitionConfig { RecognitionConfig config = 1; bool interim_results = 2; }
message StreamingRecognizeRequest {
  StreamingRecognitionConfig streaming_config = 1;
  bytes audio_content = 2;
}
message SpeechRecognitionAlternative { string transcript = 1; float confidence = 2; }
message StreamingRecognitionResult {
  repeated SpeechRecognitionAlternative alternatives = 1;
  bool is_final = 2;
  float stability = 3;
}
message StreamingRecognizeResponse { repeated StreamingRecognitionResult results = 1; }
